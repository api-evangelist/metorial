aid: metorial
name: Metorial
description: >-
  Metorial is agentic infrastructure for AI-native companies — "the Vercel for
  MCP." It hosts 1,200+ Model Context Protocol (MCP) servers serverlessly, giving
  AI agents and clients like Claude, ChatGPT, Cursor, Copilot and Codex one place
  to connect approved apps, tools and shared skills. Its hibernation technology
  makes every MCP server serverless (sub-second cold starts, pay-per-request),
  and it handles production OAuth, per-user isolation, tracing, access control
  (SSO/SAML) and ProtoGuard request safety. Developers integrate through a
  resource-oriented REST API (api.metorial.com) with official Node.js, Python and
  Go SDKs, a CLI, and standard MCP URLs. Founded 2025, San Francisco; backed by
  Y Combinator (F25).
